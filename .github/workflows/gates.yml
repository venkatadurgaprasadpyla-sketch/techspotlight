name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # 38 pages x Lighthouse (3 runs) + axe in 4 variants takes about 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gates
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: gate-reports/
          if-no-files-found: ignore

  # The production build Cloudflare Pages makes (PUBLIC_HIDE_SAMPLES=true): it must build cleanly,
  # pass the link, budget and SEO gates, and link to no sample entry.
  launch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_HIDE_SAMPLES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gates -- G1 G7 G8 G12
      - name: No sample content in the production build
        run: node scripts/launch-check.mjs
